# Release: a pushed v* tag publishes both npm packages and creates the GitHub release.
#
# Authentication is npm trusted publishing (OpenID Connect): npm trusts this repository, this file name and the
# environment "npm" - nothing is stored anywhere. Setup and limits: docs/releasing.md
#   npm docs: https://docs.npmjs.com/trusted-publishers
#   needs npm CLI >= 11.5.1 and Node >= 22.14.0 on a GitHub-hosted runner (checked by scripts/release-check.mjs workflow)
#
# Action policy (same as ci.yml): only first-party actions/* actions, by major version tag.
# Exit codes of `release-check published`: 0 already on npm (skip) · 3 definitely not on npm (publish) · anything else stops the job.
# The GitHub token is given only to the steps that call gh; the publish steps never see it.
# Every value from the event reaches a script as an environment variable, never inside the script text.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Tag name looks like a release
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag (v<major>.<minor>.<patch>): refusing to publish" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm to the minimum version that supports trusted publishing
        run: npm install --global npm@11.5.1
      - name: Check every guard again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-check.mjs workflow
          node scripts/release-check.mjs guards "$TAG"
      - name: Publish super-agent-framework
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          node scripts/release-check.mjs switch
          status=0
          node scripts/release-check.mjs published . "$VERSION" || status=$?
          case "$status" in
            0) echo "super-agent-framework@$VERSION is already on npm: skipped" ;;
            3) npm publish . --provenance ;;
            *) exit "$status" ;;
          esac
          node scripts/release-check.mjs published . "$VERSION" --wait
      - name: Publish create-saf
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          node scripts/release-check.mjs switch
          status=0
          node scripts/release-check.mjs published packages/create-saf "$VERSION" || status=$?
          case "$status" in
            0) echo "create-saf@$VERSION is already on npm: skipped" ;;
            3) npm publish ./packages/create-saf --provenance ;;
            *) exit "$status" ;;
          esac
          node scripts/release-check.mjs published packages/create-saf "$VERSION" --wait
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub release $TAG exists: skipped"
          else
            node scripts/release-check.mjs notes "$TAG" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Confirm both packages are on npm
        run: node scripts/release-check.mjs npm
      - name: Confirm the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-check.mjs release
